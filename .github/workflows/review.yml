# This fork's CI for its review lines, in place of upstream's workflows, which publish
# to nuget.org on a tag.  The jobs `test` and `lean-auto` are upstream's own test jobs
# (.github/workflows/test.yml and test-lean-auto.yml, with the timeouts of upstream's
# master and a process limit of 300 s for each test's Boogie), without the deployment
# steps.  The job `packages` builds the NuGet packages at this line's version, and on a
# tag `release` attaches them, with their sha256 sums, to a GitHub release.  Self-hosted
# arm64 macOS runners only (never GitHub-hosted); draft pull requests run nothing.
name: review

on:
  push:
    branches: ['review/**']
    tags: ['v*']
  pull_request:
    branches: ['review/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  SOLUTION: Source/Boogie.sln
  Z3URL: https://github.com/Z3Prover/z3/releases/download/z3-4.11.2/z3-4.11.2-arm64-osx-11.0.zip
  CVC5URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.4.2/cvc5-macOS-arm64-static.zip
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  canonical-map-probe:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.head_ref == 'codex/284-canonical-map-payloads' || github.ref == 'refs/heads/codex/284-canonical-map-payloads') }}
    uses: ./.github/workflows/map-payloads-probe.yml

  version:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Version
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: sh .github/review/version.sh | tee -a "$GITHUB_OUTPUT"

  test:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Boogie CI (${{ matrix.configuration }}, ${{ matrix.lit_param }})
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        lit_param: ["batch_mode=True", "batch_mode=False"]
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Checkout Boogie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools, build Boogie, test Boogie
        run: |
          # Download a Z3 release
          T="$RUNNER_TEMP/boogie-tools"
          rm -rf "$T" && mkdir -p "$T"
          curl -fsSL "${Z3URL}" -o "$T/z3.zip"
          unzip -q "$T/z3.zip" -d "$T"
          export PATH="$(find "$T" -path '*z3*' -name bin -type d):$PATH"
          # Download a CVC5 release (arm64 macOS; the old 0.0.7 macOS build is x86-64 only)
          curl -fsSL "${CVC5URL}" -o "$T/cvc5.zip"
          unzip -q "$T/cvc5.zip" -d "$T"
          export PATH="$(dirname "$(find "$T" -path '*cvc5*' -name cvc5 -type f -perm -u+x | head -1)"):$PATH"
          z3 --version && cvc5 --version | head -1
          # Install python tools into a job-local virtual environment
          python3 -m venv "$T/venv"
          "$T/venv/bin/pip" install -q setuptools lit OutputCheck pyyaml psutil
          export PATH="$T/venv/bin:$PATH"
          # Change directory to Boogie root folder
          cd $GITHUB_WORKSPACE
          # Restore dotnet tools
          dotnet tool restore
          # Check that generated scanner and parser are consistent with attributed grammar
          dotnet tool run coco Source/Core/BoogiePL.atg -namespace Microsoft.Boogie -frames Source/Core/
          diff --strip-trailing-cr Source/Core/Parser.cs Source/Core/Parser.cs.old
          diff --strip-trailing-cr Source/Core/Scanner.cs Source/Core/Scanner.cs.old
          # Build Boogie
          nice -n 10 dotnet build -m:2 -warnaserror -c ${{ matrix.configuration }} ${SOLUTION}
          # Create packages
          nice -n 10 dotnet pack -m:2 --no-build -c ${{ matrix.configuration }} ${SOLUTION}
          # Run unit tests
          nice -n 10 dotnet test -m:2 --blame-hang-timeout 300s --no-build -c ${{ matrix.configuration }} ${SOLUTION}
          # Run lit test suite.  Each Boogie process gets 300 s, lit's own limit per test, in
          # place of lit.site.cfg's 110 s: v3.5.5's civl/large-samples/GC.bpl (2,772 queries,
          # none under the arguments encoding) takes longer than 110 s in batch mode on these
          # runners, where the process limit then aborts it (upstream's master has reworked it).
          nice -n 10 lit -j 2 --param ${{ matrix.lit_param }} --param boogie_params=-processTimeLimit:300 -v --timeout=300 -D configuration=${{ matrix.configuration }} Test

  lean-auto:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: LeanAuto CI
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 90
    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Z3
        uses: cda-tum/setup-z3@v1
        with:
          version: 4.12.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout Boogie
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools, build Boogie
        run: |
          dotnet tool restore
          nice -n 10 dotnet build -m:2 -warnaserror Source/Boogie.sln
      - name: Setup Lean
        uses: Julian/setup-lean@v1
        with:
          # Lean version will be chosen based on Test/lean-auto/lean-toolchain
          default-toolchain-file: Test/lean-auto/lean-toolchain
      - name: Test Lean generator on textbook examples
        working-directory: Test/lean-auto
        run: |
          lake build
          ./testall.sh

  packages:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Packages
    needs: version
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and pack, as upstream's release does, at this line's version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          nice -n 10 dotnet build -m:2 -warnaserror -c Release -p:Version="$VERSION" ${SOLUTION}
          nice -n 10 dotnet pack -m:2 --no-build -c Release -p:Version="$VERSION" -o packages ${SOLUTION}
      - name: Check the packages and sum them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd packages
          ls -l
          # The 14 packages of an upstream release, each at this version.
          for p in Boogie Boogie.AbstractInterpretation Boogie.BaseTypes Boogie.CodeContractsExtender \
                   Boogie.Concurrency Boogie.Core Boogie.ExecutionEngine Boogie.Graph Boogie.Houdini \
                   Boogie.Model Boogie.Provers.LeanAuto Boogie.Provers.SMTLib Boogie.VCExpr Boogie.VCGeneration; do
            test -f "$p.$VERSION.nupkg"
            unzip -p "$p.$VERSION.nupkg" "$p.nuspec" | grep -q "<version>$VERSION</version>"
          done
          test "$(ls *.nupkg | wc -l)" -eq 14
          shasum -a 256 *.nupkg | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages/*.nupkg
            packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  idle-handshake:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    name: Idle handshake (Z3 5.1.0)
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch checksum-pinned Z3 5.1.0
        run: |
          curl -fsSL https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip -o "$RUNNER_TEMP/z3.zip"
          echo "81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  $RUNNER_TEMP/z3.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/z3.zip" -d "$RUNNER_TEMP/z3"
      - name: Build and run controlled handshake tests
        run: |
          nice -n 10 dotnet build -m:2 -warnaserror -c Release Source/BoogieDriver/BoogieDriver.csproj
          nice -n 10 dotnet test -m:2 -warnaserror -c Release Source/UnitTests/ExecutionEngineTests/ExecutionEngineTests.csproj --filter FullyQualifiedName~IdleHandshakeTest --logger 'trx;LogFileName=idle-handshake.trx' --results-directory idle-handshake
      - name: Compare verdicts, RU and command bytes
        run: |
          nice -n 10 python3 .github/review/idle-handshake.py Source/BoogieDriver/bin/Release/net8.0/BoogieDriver.dll "$RUNNER_TEMP/z3/z3-5.1.0-arm64-osx-13.3/bin/z3" idle-handshake/comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-handshake
          path: idle-handshake/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [version, test, lean-auto, packages]
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.ref_type == 'tag') }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: The tag must name this tree's version
        run: |
          echo "tag ${{ github.ref_name }}, expected ${{ needs.version.outputs.tag }}"
          test "${{ github.ref_name }}" = "${{ needs.version.outputs.tag }}"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd packages && shasum -a 256 -c SHA256SUMS)
          {
            cat .github/review/release-notes.md
            echo
            echo "The NuGet packages at version \`$VERSION\`, the 14 of an upstream release, built from"
            echo "this tag by the workflow \`review\`.  The tag's \`REVIEW.md\` says what the line changes"
            echo "and how its version is computed."
            echo
            echo "sha256:"
            echo
            echo '```'
            cat packages/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" packages/*.nupkg packages/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Boogie $VERSION" --notes-file notes.md
