name: Canonical map consistency checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  compare:
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 45a8869bb43456f126577f5ba6fd24725ed6e4d9
          path: baseline
      - name: Runner-local .NET install directory
        # setup-dotnet's default, the user's ~/.dotnet, is shared by every runner on the host.
        run: echo "DOTNET_INSTALL_DIR=$RUNNER_TOOL_CACHE/boogie-dotnet" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build both drivers
        run: |
          dotnet build Source/BoogieDriver -c Release -warnaserror
          dotnet build baseline/Source/BoogieDriver -c Release -warnaserror
      - name: Pin solver
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
          echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  z3.zip' | shasum -a 256 -c -
          unzip -q z3.zip
      - name: Record witnesses and legacy byte identity
        run: |
          python3 .github/review/map-payloads-probe.py baseline/Source/BoogieDriver/bin/Release/net8.0/BoogieDriver.dll \
            Source/BoogieDriver/bin/Release/net8.0/BoogieDriver.dll z3-5.1.0-arm64-osx-13.3/bin/z3 results
          if test -f results/report.json; then cat results/report.json >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-map-probe
          path: results
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-driver
          path: Source/BoogieDriver/bin/Release/net8.0
